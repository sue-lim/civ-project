<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Sue Lim">
    <meta name="description" content="Portfolio home page for Web Development course.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/site.css"> <!-- Tailwind -->
    <link rel="stylesheet" href="/assets/css/style.css"> <!-- Custom Styles -->
    <script defer src ="/assets/js/main.js"></script>
    <title>Sue Lim | Contact</title>
</head>

<body class="bg-gradient-to-r from-[#2E266D] to-[#0B0320] text-white overflow-hidden flex flex-col">

    <!-- NAVIGATION -->
    <header class="w-full">
        <nav class="nav-link-gap">
            <a href="/">
                <img src="/assets/img/logo-375px.png" alt="Logo" class="w-14">
            </a>

            <ul class="hidden md:flex gap-4 text-sm">
                <li><a href="/" class="nav-hover-behaviour">Home</a></li>
                <li><a href="/about.html" class="nav-hover-behaviour">About</a></li>
                <li><a href="/my-portfolio.html" class="nav-hover-behaviour">My Portfolio</a></li>
                <li><a href="/my-tafe-projects.html" class="nav-hover-behaviour">My TAFE Projects</a></li>
                <li><a href="/resume.html" class="nav-hover-behaviour">Resume</a></li>
                <li><a href="/contact.html" class="nav-hover-behaviour">Contact</a></li>
            </ul>
        </nav>
    </header>
    <!-- MAIN CONTAINER -->
    <main class="px-10">

<div class="">

    <div class="min-w-md max-w-md">
        <h2 class="text-xl mb-10 mt-10 sm:text-6xl font-bold text-primary">Contact me</h2>

        <form id="contactForm" class="flex space-y-4 mb-4 bg-transparent">
<!-- INPUT NAME FIELD -->
            <label class="text-sm font-medium">Name</label>
            <input type="text" name="from_name" class="w-full px-3 py-2 rounded border border-gray-500 bg-transparent text-white focus:outline-none focus:ring-2 focus:ring-white">
<!-- INPUT EMAIL FIELD -->
            <label class="text-sm font-medium">Email</label>
            <input type="email" name="from_email" class="w-full px-3 py-2 rounded border border-gray-500 bg-transparent text-white focus:outline-none focus:ring-2 focus:ring-white">
<!-- INPUT MSG FIELD -->
            <label class="text-sm font-medium">Message</label>
            <textarea name="message" rows="4" class="w-full px-3 py-2 rounded border border-gray-500 bg-transparent text-white resize-none focus:outline-none focus:ring-2 focus:ring-white"></textarea>
<!-- SEND BUTTON -->
            <input type="submit" value="Send" class="mt-8 px-4 py-3 rounded border border-white bg-transparent text-white font-semibold cursor-pointer hover:bg-gray-500 transition">

            <div id="statusMessage" class="text-center text-white mt-2"></div>
        </form>
    </div>
</div>

    
    </main>

    <!-- FOOTER -->
    <footer class="footer-bottom-sticky-behaviour">
        <p><a href="/copyright.html">© 2023 Copyright: </a>
            <a href="/about.html" class="underline">Sue Lim</a>
        </p>
    </footer>

</body>
</html>
